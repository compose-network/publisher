# Publisher configuration

server:
  listen_addr: ":8080"
  write_timeout: 30s

metrics:
  enabled: true
  port: 8081
  path: /metrics

# HTTP API server (health, readiness, stats)
api:
  listen_addr: ":8081"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 120s
  max_header_bytes: 1048576

log:
  level: info
  pretty: true
  output: stdout

consensus:
  timeout: "3s"
  role: "leader"

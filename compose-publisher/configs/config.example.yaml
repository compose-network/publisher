# Compose Publisher configuration
# Copy this file to config.yaml and adjust values as needed.
#
# Environment variable overrides use the pattern <SECTION>_<KEY>
# (dots replaced with underscores). Examples:
#   SERVER_LISTEN_ADDR=":9090"
#   LOG_LEVEL=debug
#   CONSENSUS_TIMEOUT=60s
#   METRICS_PORT=3000

# QUIC server for sidecar connections
server:
  # Listen address for QUIC transport
  # ENV: SERVER_LISTEN_ADDR
  listen_addr: ":8080"

  # Write timeout for outgoing messages
  # ENV: SERVER_WRITE_TIMEOUT
  write_timeout: 30s

# HTTP API server (health, readiness, stats)
api:
  # Listen address for the HTTP API
  # ENV: API_LISTEN_ADDR
  listen_addr: ":8081"

  # Timeouts
  # ENV: API_READ_HEADER_TIMEOUT, API_READ_TIMEOUT, API_WRITE_TIMEOUT, API_IDLE_TIMEOUT
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 120s

  # Max header bytes (default 1MB)
  # ENV: API_MAX_HEADER_BYTES
  max_header_bytes: 1048576

# Consensus (2PC) configuration
consensus:
  # Timeout for cross-chain transaction consensus rounds
  # ENV: CONSENSUS_TIMEOUT
  timeout: "60s"

  # Role of this node in the consensus protocol
  # ENV: CONSENSUS_ROLE
  role: "leader"

# Prometheus metrics
metrics:
  # Enable metrics endpoint
  # ENV: METRICS_ENABLED
  enabled: true

  # HTTP port for metrics (served on the API server)
  # ENV: METRICS_PORT
  port: 8081

  # Metrics URL path
  # ENV: METRICS_PATH
  path: /metrics

# Logging
log:
  # Log level: trace, debug, info, warn, error, fatal, panic
  # ENV: LOG_LEVEL
  level: info

  # Pretty print logs (true for development, false for production JSON)
  # ENV: LOG_PRETTY
  pretty: false

  # Output destination: stdout, stderr, file
  # ENV: LOG_OUTPUT
  output: stdout

  # Log file path (only used when output=file)
  # ENV: LOG_FILE
  # file: /var/log/publisher.log
